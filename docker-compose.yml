services:
  web:
    build: .
    ports:
      - '8080:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Must match the URL you use in the browser (host + published port).
      - ORIGIN=${ORIGIN:-http://localhost:8080}
      - DATA_DIR=/app/data
      - CONTACT_FORM_TO_EMAIL=${CONTACT_FORM_TO_EMAIL:-}
      - CONTACT_FORM_FROM_EMAIL=${CONTACT_FORM_FROM_EMAIL:-}
      - CONTACT_FORM_SUBJECT_PREFIX=${CONTACT_FORM_SUBJECT_PREFIX:-[Website]}
      - CONTACT_SMTP_HOST=${CONTACT_SMTP_HOST:-}
      - CONTACT_SMTP_PORT=${CONTACT_SMTP_PORT:-587}
      - CONTACT_SMTP_USERNAME=${CONTACT_SMTP_USERNAME:-}
      - CONTACT_SMTP_PASSWORD=${CONTACT_SMTP_PASSWORD:-}
      - CONTACT_SMTP_ENCRYPTION=${CONTACT_SMTP_ENCRYPTION:-tls}
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
