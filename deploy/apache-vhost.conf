<VirtualHost *:80>
    ServerName armenderoian.dev
    ServerAlias www.armenderoian.dev
    DocumentRoot /var/www/personal-website

    ErrorLog ${APACHE_LOG_DIR}/personal-site-error.log
    CustomLog ${APACHE_LOG_DIR}/personal-site-access.log combined

    <Directory /var/www/personal-website>
        Options -Indexes +FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteRule ^/admin(?:/.*)?$ /admin.php [L,QSA]
        RewriteRule ^/project/([^/]+)/?$ /project.php?slug=$1 [L,QSA]
        RewriteRule ^/projects/?$ /projects.php [L]
    </IfModule>
</VirtualHost>
